<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>7.7 Under The Sea</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #00c6ff, #004e92);
      color: white;
      overflow-x: hidden;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      padding: 15px 30px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav h2 {
      margin: 0;
      font-size: 20px;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* HEADER */
    header {
      padding: 120px 20px 80px;
      text-align: center;
      animation: fadeDown 1.5s ease;
    }

    header h1 {
      font-size: 3.5em;
      margin: 0;
      letter-spacing: 2px;
    }

    header p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 2em;
    }

    /* FOTO KELAS */
    .foto-kelas img {
      width: 90%;
      max-width: 650px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      animation: float 4s ease-in-out infinite;
    }

    /* GURU */
    .guru img {
      width: 220px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      animation: float 3s ease-in-out infinite;
    }

    /* GALERI */
    .galeri {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .galeri img {
      width: 100%;
      border-radius: 18px;
      transition: transform 0.4s, box-shadow 0.4s;
    }

    .galeri img:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    /* IKAN ANIMASI */
    .fish {
      position: absolute;
      top: 60%;
      left: -150px;
      font-size: 50px;
      animation: swim 18s linear infinite;
      opacity: 0.8;
    }

    .fish.two {
      top: 75%;
      animation-duration: 25s;
      font-size: 35px;
    }

    @keyframes swim {
      from { transform: translateX(-200px); }
      to { transform: translateX(120vw); }
    }

    /* MUSIK */
    .musik {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      color: #004e92;
      border: none;
      padding: 15px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      z-index: 99;
    }

    /* FOOTER */
    footer {
      background: rgba(0,0,0,0.4);
      padding: 25px;
      text-align: center;
      font-size: 14px;
      opacity: 0.9;
    }

    /* ANIMASI UMUM */
    @keyframes fadeDown {
      from {opacity: 0; transform: translateY(-40px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @keyframes float {
      0%,100% {transform: translateY(0);}
      50% {transform: translateY(-18px);}
    }
  </style>
</head>

<body>

  <!-- IKAN -->
  <div class="fish">🐠</div>
  <div class="fish two">🐟</div>

  <!-- NAVBAR -->
  <nav>
    <h2>🌊 7.7</h2>
    <div>
      <a href="#kelas">Kelas</a>
      <a href="#guru">Guru</a>
      <a href="#galeri">Galeri</a>
    </div>
  </nav>

  <!-- HEADER -->
  <header>
    <h1>7.7 Under The Sea</h1>
    <p>Website Resmi Kelas 7.7 🌊🐬</p>
  </header>

  <!-- FOTO KELAS -->
  <section id="kelas" class="foto-kelas">
    <h2>📷 Foto Kelas</h2>
    <img src="kelas.jpg" alt="Foto Kelas 7.7">
  </section>

  <!-- GURU -->
  <section id="guru" class="guru">
    <h2>👩‍🏫 Wali Kelas</h2>
    <img src="guru.jpg" alt="Guru Kelas">
    <p>Yurisnawati S.Pd✨</p>
  </section>

  <!-- GALERI -->
  <section id="galeri">
    <h2>📸 Kegiatan Kelas</h2>
    <div class="galeri">
      <img src="kegiatan1.jpg">
      <img src="kegiatan2.jpg">
      <img src="kegiatan3.jpg">
    </div>
  </section>

  <!-- MUSIK -->
  <audio id="musik" src="musik.mp3" loop></audio>
  <button class="musik" onclick="toggleMusic()">🎵</button>

  <footer>
    © 2026 Kelas 7.7 – Under The Sea | Dibuat dengan 💙
  </footer>

  <script>
    const musik = document.getElementById("musik");
    let play = false;

    function toggleMusic() {
      if (!play) {
        musik.play();
        play = true;
      } else {
        musik.pause();
        play = false;
      }
    }
  </script>

</body>
</html>
